<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 640" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/>
    </marker>
  </defs>
  <rect width="860" height="640" fill="#F9FAFB"/>
  <text x="430" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">shngAdmin — Stream Flow (Server-Sent Events)</text>
  <text x="430" y="43" text-anchor="middle" font-size="10" fill="#6B7280">One EventSource per page (SystemComponent, ItemTreeComponent); what it receives is changed with REST PATCH requests</text>
  <text x="130" y="72" text-anchor="middle" font-size="11" font-weight="bold" fill="#1E40AF">Component</text>
  <line x1="130" y1="80" x2="130" y2="622" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="430" y="72" text-anchor="middle" font-size="11" font-weight="bold" fill="#5B21B6">StreamService</text>
  <line x1="430" y1="80" x2="430" y2="622" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="730" y="72" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350F">SHNG  /api/stream/</text>
  <line x1="730" y1="80" x2="730" y2="622" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="5,4"/>
  <rect x="10" y="96" width="840" height="16" rx="2" fill="#DBEAFE"/>
  <text x="430" y="108" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1E40AF">Connect (after AppConfigService.serverReady$ has emitted)</text>
  <line x1="130" y1="130" x2="430" y2="130" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="138" y="125" font-size="9" fill="#374151">stream.connect()</text>
  <line x1="430" y1="156" x2="730" y2="156" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="438" y="151" font-size="9" fill="#374151">GET /api/stream/token  (normal JWT authorisation)</text>
  <line x1="730" y1="182" x2="430" y2="182" stroke="#16A34A" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="438" y="177" font-size="9" fill="#16A34A">{ token }  — short-lived, single use</text>
  <line x1="430" y1="208" x2="730" y2="208" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="438" y="203" font-size="9" fill="#374151">new EventSource('/api/stream/?token=…')</text>
  <line x1="730" y1="234" x2="430" y2="234" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#ap)"/>
  <text x="438" y="229" font-size="9" fill="#7C3AED">event 'connection'  { connectionId }</text>
  <rect x="10" y="252" width="840" height="16" rx="2" fill="#EDE9FE"/>
  <text x="430" y="264" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#5B21B6">Subscribe (always the complete current state; the backend keeps nothing across connections)</text>
  <line x1="130" y1="286" x2="430" y2="286" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="138" y="281" font-size="9" fill="#374151">getSeriesLoad(), getMonitoredItems(paths, cb), …</text>
  <line x1="430" y1="312" x2="730" y2="312" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="438" y="307" font-size="9" fill="#374151">PATCH /api/stream/&lt;connectionId&gt;  { addItems, removeItems, addSeries, removeSeries }</text>
  <rect x="10" y="330" width="840" height="16" rx="2" fill="#DCFCE7"/>
  <text x="430" y="342" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#14532D">Receive</text>
  <line x1="730" y1="364" x2="430" y2="364" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#ap)"/>
  <text x="438" y="359" font-size="9" fill="#7C3AED">event 'series'  { sid, points }   (matched by sid)</text>
  <line x1="430" y1="390" x2="130" y2="390" stroke="#16A34A" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="138" y="385" font-size="9" fill="#16A34A">this.systemload.set(new SeriesData) → template re-renders</text>
  <line x1="730" y1="416" x2="430" y2="416" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#ap)"/>
  <text x="438" y="411" font-size="9" fill="#7C3AED">event 'item'  { path, value, … }</text>
  <line x1="430" y1="442" x2="130" y2="442" stroke="#16A34A" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="138" y="437" font-size="9" fill="#16A34A">callback → SharedService.monitoredItemsList (signal, mirrored to localStorage)</text>
  <rect x="10" y="460" width="840" height="16" rx="2" fill="#FEE2E2"/>
  <text x="430" y="472" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#991B1B">Reconnect (stream breaks)</text>
  <text x="440" y="494" font-size="9" font-style="italic" fill="#991B1B">backoff 2 → 4 → 8 → 16 → 30 s; reset when a 'connection' event arrives</text>
  <line x1="430" y1="516" x2="730" y2="516" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#ap)"/>
  <text x="438" y="511" font-size="9" fill="#7C3AED">new EventSource(…) → event 'connection' with a NEW connectionId</text>
  <line x1="430" y1="542" x2="730" y2="542" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="438" y="537" font-size="9" fill="#374151">PATCH again: every monitored path and every series subscription</text>
  <rect x="10" y="560" width="840" height="16" rx="2" fill="#F1F5F9"/>
  <text x="430" y="572" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#334155">Disconnect</text>
  <line x1="130" y1="594" x2="430" y2="594" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="138" y="589" font-size="9" fill="#374151">disconnect()  (component ngOnDestroy) → stream closed, no further reconnects</text>
</svg>
