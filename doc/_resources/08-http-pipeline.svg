<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 548" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect width="860" height="548" fill="#F9FAFB"/>
  <text x="430" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">shngAdmin — HTTP Request Pipeline</text>
  <text x="430" y="44" text-anchor="middle" font-size="10" fill="#6B7280">Every HTTP call from any service flows through this chain before reaching the network</text>

  <!-- Request path -->
  <rect x="10" y="60" width="130" height="80" rx="6" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="75.0" y="80" text-anchor="middle" font-size="10" font-weight="bold" fill="#1E40AF">Domain API Service</text>
  <text x="75.0" y="96" text-anchor="middle" font-size="8.5" fill="#1E3A8A">e.g. ItemsApiService</text>
  <text x="75.0" y="109" text-anchor="middle" font-size="8.5" fill="#1E3A8A">this.http.get('/api/items/')</text>
  <rect x="160" y="60" width="130" height="80" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="225.0" y="80" text-anchor="middle" font-size="10" font-weight="bold" fill="#334155">Angular HttpClient</text>
  <text x="225.0" y="96" text-anchor="middle" font-size="8.5" fill="#475569">Creates HttpRequest.</text>
  <text x="225.0" y="109" text-anchor="middle" font-size="8.5" fill="#475569">Chains interceptors.</text>
  <rect x="310" y="60" width="150" height="80" rx="6" fill="#FEF3C7" stroke="#FCD34D" stroke-width="2"/>
  <text x="385.0" y="80" text-anchor="middle" font-size="10" font-weight="bold" fill="#78350F">JWT Interceptor</text>
  <text x="385.0" y="96" text-anchor="middle" font-size="8.5" fill="#92400E">(@auth0/angular-jwt, via DI)</text>
  <text x="385.0" y="109" text-anchor="middle" font-size="8.5" fill="#92400E">allowedDomains: [hostname]</text>
  <text x="385.0" y="122" text-anchor="middle" font-size="8.5" fill="#92400E">Adds: Authorization: Bearer &lt;jwt&gt;</text>
  <rect x="480" y="60" width="150" height="80" rx="6" fill="#FEF3C7" stroke="#FCD34D" stroke-width="2"/>
  <text x="555.0" y="80" text-anchor="middle" font-size="10" font-weight="bold" fill="#78350F">Connectivity Interceptor</text>
  <text x="555.0" y="96" text-anchor="middle" font-size="8.5" fill="#92400E">request: cancelOfflineDebounce()</text>
  <text x="555.0" y="109" text-anchor="middle" font-size="8.5" fill="#92400E">error (status 0): markOffline()</text>
  <rect x="650" y="60" width="150" height="80" rx="6" fill="#FEF3C7" stroke="#FCD34D" stroke-width="2"/>
  <text x="725.0" y="80" text-anchor="middle" font-size="10" font-weight="bold" fill="#78350F">Auth-Error Interceptor</text>
  <text x="725.0" y="96" text-anchor="middle" font-size="8.5" fill="#92400E">HTTP 401 on /api/:</text>
  <text x="725.0" y="109" text-anchor="middle" font-size="8.5" fill="#92400E">drops token, → /login or</text>
  <text x="725.0" y="122" text-anchor="middle" font-size="8.5" fill="#92400E">new anonymous token</text>
  <line x1="140" y1="92" x2="159" y2="92" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <line x1="290" y1="92" x2="309" y2="92" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <line x1="460" y1="92" x2="479" y2="92" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <line x1="630" y1="92" x2="649" y2="92" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <line x1="800" y1="100" x2="818" y2="100" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <rect x="820" y="78" width="30" height="44" rx="4" fill="#6B7280"/>
  <text x="835" y="102" text-anchor="middle" font-size="8" fill="#fff" writing-mode="tb">NET</text>

  <text x="430" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">↓ Response flows back through the interceptors in reverse order ↓</text>

  <!-- Success response -->
  <rect x="10" y="182" width="840" height="14" rx="2" fill="#DCFCE7"/>
  <text x="430" y="193" text-anchor="middle" font-size="9" font-weight="bold" fill="#14532D">Success path (HTTP 2xx)</text>
  <rect x="650" y="202" width="150" height="52" rx="6" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="725.0" y="220" text-anchor="middle" font-size="9" fill="#14532D">Auth-error interceptor:</text>
  <text x="725.0" y="234" text-anchor="middle" font-size="9" fill="#14532D">passes the response</text>
  <text x="725.0" y="248" text-anchor="middle" font-size="9" fill="#14532D">through unchanged.</text>
  <rect x="480" y="202" width="150" height="52" rx="6" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="555.0" y="220" text-anchor="middle" font-size="9" fill="#14532D">Connectivity interceptor:</text>
  <text x="555.0" y="234" text-anchor="middle" font-size="9" fill="#14532D">cancelOfflineDebounce() —</text>
  <text x="555.0" y="248" text-anchor="middle" font-size="9" fill="#14532D">server answered, we are online.</text>
  <rect x="310" y="202" width="150" height="52" rx="6" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="385.0" y="220" text-anchor="middle" font-size="9" fill="#14532D">JWT interceptor:</text>
  <text x="385.0" y="234" text-anchor="middle" font-size="9" fill="#14532D">passes response through</text>
  <text x="385.0" y="248" text-anchor="middle" font-size="9" fill="#14532D">unchanged.</text>
  <rect x="10" y="202" width="280" height="52" rx="6" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="150.0" y="220" text-anchor="middle" font-size="9" fill="#14532D">HttpClient delivers Observable&lt;T&gt; to the caller.</text>
  <text x="150.0" y="234" text-anchor="middle" font-size="9" fill="#14532D">subscribe() / toSignal() writes the result</text>
  <text x="150.0" y="248" text-anchor="middle" font-size="9" fill="#14532D">into a signal; the template re-renders.</text>
  <line x1="650" y1="228" x2="630" y2="228" stroke="#16A34A" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="480" y1="228" x2="460" y2="228" stroke="#16A34A" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="310" y1="228" x2="290" y2="228" stroke="#16A34A" stroke-width="2" marker-end="url(#ag)"/>

  <!-- Error response -->
  <rect x="10" y="270" width="840" height="14" rx="2" fill="#FEE2E2"/>
  <text x="430" y="281" text-anchor="middle" font-size="9" font-weight="bold" fill="#991B1B">Error path (network failure / HTTP 4xx 5xx)</text>
  <rect x="650" y="290" width="150" height="80" rx="6" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="725.0" y="308" text-anchor="middle" font-size="9" fill="#991B1B">Auth-error interceptor:</text>
  <text x="725.0" y="322" text-anchor="middle" font-size="9" fill="#991B1B">401 → drop token; login</text>
  <text x="725.0" y="336" text-anchor="middle" font-size="9" fill="#991B1B">required → /login?returnUrl=…,</text>
  <text x="725.0" y="350" text-anchor="middle" font-size="9" fill="#991B1B">else new anonymous token.</text>
  <text x="725.0" y="364" text-anchor="middle" font-size="9" fill="#991B1B">Re-throws the error.</text>
  <rect x="480" y="290" width="150" height="80" rx="6" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="555.0" y="308" text-anchor="middle" font-size="9" fill="#991B1B">Connectivity interceptor:</text>
  <text x="555.0" y="322" text-anchor="middle" font-size="9" fill="#991B1B">status === 0 (network error)</text>
  <text x="555.0" y="336" text-anchor="middle" font-size="9" fill="#991B1B">→ markOffline() debounce timer.</text>
  <text x="555.0" y="350" text-anchor="middle" font-size="9" fill="#991B1B">Re-throws error for caller.</text>
  <rect x="310" y="290" width="150" height="80" rx="6" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="385.0" y="308" text-anchor="middle" font-size="9" fill="#991B1B">JWT interceptor:</text>
  <text x="385.0" y="322" text-anchor="middle" font-size="9" fill="#991B1B">passes error through</text>
  <text x="385.0" y="336" text-anchor="middle" font-size="9" fill="#991B1B">unchanged (no retry</text>
  <text x="385.0" y="350" text-anchor="middle" font-size="9" fill="#991B1B">logic here).</text>
  <rect x="10" y="290" width="280" height="80" rx="6" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="150.0" y="308" text-anchor="middle" font-size="9" fill="#991B1B">Caller error handler:</text>
  <text x="150.0" y="322" text-anchor="middle" font-size="9" fill="#991B1B">LogicsApiService fires sticky toast via MessageService.</text>
  <text x="150.0" y="336" text-anchor="middle" font-size="9" fill="#991B1B">Other services log via LogService.</text>
  <text x="150.0" y="350" text-anchor="middle" font-size="9" fill="#991B1B">OfflineBanner shown by ConnectivityService.online$.</text>
  <line x1="650" y1="330" x2="630" y2="330" stroke="#DC2626" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="480" y1="330" x2="460" y2="330" stroke="#DC2626" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="310" y1="330" x2="290" y2="330" stroke="#DC2626" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Additional notes -->
  <rect x="10" y="386" width="840" height="152" rx="6" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.5"/>
  <text x="430" y="406" text-anchor="middle" font-size="11" font-weight="bold" fill="#0369A1">Additional HTTP details</text>
  <text x="24" y="426" font-size="9.5" font-weight="bold" fill="#0369A1">Base URL</text>
  <text x="24" y="440" font-size="9" fill="#374151">All API calls use the relative path /api/ (set by ServerApiService) — the dev proxy (proxy.conf.js) forwards /api/, /admin/, /plugin/ and</text>
  <text x="24" y="453" font-size="9" fill="#374151">/gstatic/ to the real SHNG server during development. In production, SHNG serves the Angular app and the API from the same origin.</text>
  <text x="24" y="473" font-size="9.5" font-weight="bold" fill="#0369A1">Interceptor registration (main.ts)</text>
  <text x="24" y="487" font-size="9" fill="#374151">provideHttpClient(withInterceptorsFromDi(), withInterceptors([connectivityInterceptor, authErrorInterceptor])): the JWT module is a DI-based</text>
  <text x="24" y="500" font-size="9" fill="#374151">interceptor and runs first; the two functional interceptors (Angular 15+ pattern, preferred for new code) follow in array order.</text>
  <text x="24" y="520" font-size="9.5" font-weight="bold" fill="#0369A1">Observable subscription lifecycle</text>
  <text x="24" y="534" font-size="9" fill="#374151">Subscriptions use .pipe(takeUntilDestroyed(this.destroyRef)) or toSignal() — they auto-cancel when the component or service is destroyed.</text>
</svg>
