@switch (inputKind) {
  @case ('select') {
    <p-select
      [options]="selectOptions"
      [showClear]="true"
      [placeholder]="placeholder"
      [(ngModel)]="row()[col().field]"
      (ngModelChange)="row()[col().field] = $event; onChanged()"
      [style]="{ width: '100%' }"
      appendTo="body"
    >
    </p-select>
  }
  @case ('number') {
    <p-inputnumber
      [(ngModel)]="row()[col().field]"
      [min]="validMin"
      [max]="validMax"
      [useGrouping]="false"
      [placeholder]="placeholder"
      [name]="col().field"
      style="width: 100%"
      [inputStyle]="{ width: '100%' }"
      (ngModelChange)="onChanged()"
    />
  }
  @case ('password') {
    <input
      [(ngModel)]="row()[col().field]"
      type="password"
      pInputText
      [placeholder]="placeholder"
      [name]="col().field"
      style="width: 100%"
      (ngModelChange)="onChanged()"
    />
  }
  @case ('text-readonly') {
    <input
      [(ngModel)]="row()[col().field]"
      type="text"
      readonly
      pInputText
      [placeholder]="placeholder"
      [name]="col().field"
      style="width: 100%; color: #000077"
      (ngModelChange)="onChanged()"
    />
  }
  @case ('text-wide') {
    <input
      [(ngModel)]="row()[col().field]"
      type="text"
      pInputText
      [placeholder]="placeholder"
      [name]="col().field"
      style="width: 100%"
      (ngModelChange)="onChanged()"
    />
  }
  @case ('text') {
    <input
      [(ngModel)]="row()[col().field]"
      type="text"
      pInputText
      [placeholder]="placeholder"
      [name]="col().field"
      style="width: 100%"
      (ngModelChange)="onChanged()"
    />
  }
}
