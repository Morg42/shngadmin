<div class="menubox" id="example" style="display: inline; position: relative; z-index: 10000">
  <p-menubar [model]="getMenuItems()">
    <picture>
      <source media="(min-width: 980px)" srcset="assets/img/logo_long.png" />
      <source media="(min-width: 480px)" srcset="assets/img/logo_small_32x32.png" />
      <img id="logo" style="display: inline; position: fixed" routerLink="/system" ngSrc="no.png" />
    </picture>

    <button
      id="logoutButtonL"
      pButton
      label="{{ 'BUTTON.LOGOUT' | translate }}"
      (click)="logout()"
      [disabled]="!(authService.isLoggedIn() && authService.loginRequired())"
      icon="fa fa-sign-out-alt"
      style="margin-left: 0.25em"
      class="hide-on-small ui-button-success"
    ></button>
    <button
      id="logoutButtonS"
      pButton
      (click)="logout()"
      [disabled]="!(authService.isLoggedIn() && authService.loginRequired())"
      icon="fa fa-sign-out-alt"
      style="margin-left: 0.25em"
      class="hide-on-large ui-button-success"
    ></button>
  </p-menubar>
</div>
